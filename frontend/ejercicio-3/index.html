<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 3 - Formulario</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card-form">
    <h2>Registro de Usuario</h2>
    <form id="formRegistro">
      <div class="campo">
        <label for="campoNombre">Nombre completo:</label>
        <input type="text" id="campoNombre">
      </div>

      <div class="campo">
        <label for="campoEmail">Correo electrónico:</label>
        <input type="email" id="campoEmail">
      </div>

      <button type="submit">Enviar datos</button>
    </form>

    <div id="alerta" class="alerta oculto"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
